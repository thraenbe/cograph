name: Bug report
description: Report something that isn't working in CoGraph
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in the details below so it can be reproduced.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: 'When I run "CoGraph: Visualize Project" on my repo, the graph is empty…'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. A small sample project or repo link helps enormously.
      placeholder: |
        1. Open folder '…'
        2. Run command '…'
        3. See error '…'
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Project language
      description: Which language analyzer was involved?
      options:
        - Python
        - TypeScript
        - JavaScript
        - Java
        - C++
        - Mixed / other
    validations:
      required: true
  - type: input
    id: cograph-version
    attributes:
      label: CoGraph version
      placeholder: e.g. 1.1.0
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: "Help → About, e.g. 1.95.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: vscode-install
    attributes:
      label: How is VS Code installed? (Linux only)
      description: Snap, deb/rpm, tarball, Flatpak… (snap pins an old libstdc++ that can affect analyzers).
      placeholder: e.g. snap
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant output from the Output panel, Developer Tools console, or a screenshot.
      render: shell
