version: 2
updates:
  # npm runtime + dev dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Supply-chain quarantine: never propose an npm version that is less than
    # ~10 days old (lets malicious/compromised publishes be caught and yanked first).
    cooldown:
      default-days: 11
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 11
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
