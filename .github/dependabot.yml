version: 2
updates:
  # npm runtime + dev dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Supply-chain quarantine: never propose an npm version that is less than
    # ~10 days old (lets malicious/compromised publishes be caught and yanked first).
    cooldown:
      default-days: 11
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vsce refuses to package @types/vscode newer than engines.vscode (^1.75):
      # bump this only together with a deliberate engines.vscode raise (see PR #44).
      - dependency-name: "@types/vscode"
      # Keep node types on the runtime major used by CI and engines (Node 20) —
      # newer-major types allow APIs that don't exist at runtime (see PR #46).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 9+ requires flat config + typescript-eslint v8; take majors only
      # as a dedicated migration (see PR #47).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 11
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
