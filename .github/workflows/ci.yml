name: CI

on:
  push:
    # Release integration branches too: a PR that targets one of these otherwise
    # merges with no cross-platform check at all. That is how an MCP bug that made
    # every path-taking tool fail on Windows reached version_1.4.0 unnoticed.
    branches: [main, 'version_*']
  pull_request:
    branches: [main, 'version_*']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci

      # Keep version in sync with VSCODE_VERSION in src/test/runTest.ts
      - name: Cache VS Code test binary
        uses: actions/cache@v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-1.116.0

      - name: Run tests (Linux needs xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run tests
        if: runner.os != 'Linux'
        run: npm test
      - run: npm run package
