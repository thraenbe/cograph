name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write      # create the GitHub Release and upload the .vsix
  id-token: write      # sign the provenance attestation with Sigstore
  attestations: write  # store the attestation on the repository
  # Read access to GitHub Packages for the PR Tour component (used with GITHUB_TOKEN, see below).
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag can be moved to other
      # code, a SHA cannot. Dependabot keeps the SHA and the version comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config for later steps to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - run: npm ci

      # Keep version in sync with VSCODE_VERSION in src/test/runTest.ts
      - name: Cache VS Code test binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-1.116.0

      - name: Run tests (Linux needs xvfb)
        run: xvfb-run -a npm test

      # The commercial PR Tour component: the private package @thraenbe/pr-tour on GitHub
      # Packages, at the version pinned in package.json under "cograph": { "tourPackage" }.
      # esbuild (vscode:prepublish) copies it into dist/tour, so it ships in this .vsix only.
      # TOUR_PACKAGE_TOKEN: a token that can read the package (read:packages). Once the
      # package grants this repository Actions access, secrets.GITHUB_TOKEN works instead
      # (this workflow has packages: read); set TOUR_PACKAGE_TOKEN to it or swap the
      # expression below. Skipped while the secret is empty, so forks and dry-run tags build
      # the public extension, which hides the tour buttons.
      # The .npmrc holds ${TOUR_PACKAGE_TOKEN} literally; npm expands it at install time,
      # so the token is never written to disk.
      - name: Install the PR Tour package
        if: ${{ env.TOUR_PACKAGE_TOKEN != '' }}
        env:
          TOUR_PACKAGE_TOKEN: ${{ secrets.TOUR_PACKAGE_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').cograph.tourPackage")
          printf '%s\n' '@thraenbe:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${TOUR_PACKAGE_TOKEN}' > "$RUNNER_TEMP/tour.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/tour.npmrc" npm install --no-save "@thraenbe/pr-tour@${version}"
          test -f node_modules/@thraenbe/pr-tour/dist/host/index.js

      - name: Package extension
        run: npm run package

      - name: Check the PR Tour component is in the .vsix
        if: ${{ env.TOUR_PACKAGE_TOKEN != '' }}
        env:
          TOUR_PACKAGE_TOKEN: ${{ secrets.TOUR_PACKAGE_TOKEN }}
        run: unzip -l "$(ls *.vsix | head -n1)" | grep -q 'extension/dist/tour/host/index.js'

      - name: Locate .vsix
        id: vsix
        run: echo "path=$(ls *.vsix | head -n1)" >> "$GITHUB_OUTPUT"

      # SLSA build provenance: a signed statement that this exact .vsix was built by
      # this workflow from this commit. Verify with: gh attestation verify <file> -R thraenbe/cograph
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.vsix.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.vsix.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Publishes to the VS Code Marketplace.
      # Skipped automatically until the VSCE_PAT repository secret is configured,
      # so a first dry-run tag still produces a GitHub Release without failing.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # Publish the .vsix that was tested, attested and attached above, not a fresh repackage.
        run: npm run publish -- --packagePath "${{ steps.vsix.outputs.path }}"

      # Publishes the same .vsix to Open VSX (Cursor, Windsurf, VSCodium).
      # Skipped until the OVSX_PAT repository secret is configured.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish "${{ steps.vsix.outputs.path }}"
